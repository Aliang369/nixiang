    /* -------- modal -------- */
    function openModal(html, wide) {

    /** 鍙悳绱?+ 鍙粴鍔ㄩ€夋嫨鍣紱kind=games|templates */
    function gamePickerMarkup(id, opts) {
      const empty = (opts && opts.emptyLabel) || '璇烽€夋嫨';
      const allowEmpty = !!(opts && opts.allowEmpty);
      const onchange = (opts && opts.onchange) || '';
      const kind = (opts && opts.kind) || 'games';
      const ph = (opts && opts.searchPlaceholder) || (kind === 'templates' ? '鎼滅储妯℃澘鍚嶇О / id' : '鎼滅储鍚嶇О / game_id');
      return `<div class="game-picker" data-gp="${escapeHtml(id)}" data-kind="${escapeHtml(kind)}" data-empty="${escapeHtml(empty)}" data-allow-empty="${allowEmpty ? '1' : '0'}" data-search-ph="${escapeHtml(ph)}"${onchange ? ` data-onchange="${escapeHtml(onchange)}"` : ''}></div>`;
    }

    function getPickerRoot(id) {
      return document.querySelector(`.game-picker[data-gp="${id}"]`);
    }

    function getGamePickerValue(id) {
      const root = getPickerRoot(id);
      if (!root) {
        const el = document.getElementById(id);
        return el ? (el.value || '') : '';
      }
      return root.dataset.value || '';
    }

    function setGamePickerValue(id, value, silent) {
      const root = getPickerRoot(id);
      if (!root) {
        const el = document.getElementById(id);
        if (el) el.value = value || '';
        return;
      }
      root.dataset.value = value || '';
      refreshGamePickerLabel(root);
      if (!silent) {
        const fn = root.dataset.onchange;
        if (fn && typeof window[fn] === 'function') window[fn]();
      }
    }

    function pickerItems(root) {
      const kind = root.dataset.kind || 'games';
      if (kind === 'templates') {
        return menuTemplates.map(t => ({
          id: t.id,
          name: t.name,
          sub: `${t.id} 路 ${t.feature_count || (t.features || []).length} 椤筦,
          search: `${t.id} ${t.name} ${t.package || ''}`,
        }));
      }
      return gamesCache.map(g => ({
        id: g.game_id,
        name: g.name,
        sub: g.game_id,
        search: `${g.game_id} ${g.name} ${g.menu_template || ''}`,
      }));
    }

    function refreshGamePickerLabel(root) {
      const val = root.dataset.value || '';
      const empty = root.dataset.empty || '璇烽€夋嫨';
      const label = root.querySelector('.gp-label');
      if (!label) return;
      if (!val) {
        label.textContent = empty;
        label.classList.add('is-placeholder');
        return;
      }
      const item = pickerItems(root).find(x => x.id === val);
      label.textContent = item
        ? (root.dataset.kind === 'templates' ? `${item.name}锛?{item.sub}锛塦 : `${item.name} (${item.sub})`)
        : val;
      label.classList.remove('is-placeholder');
    }

    function resetPickerPanelStyle(panel) {
      if (!panel) return;
      panel.classList.remove('is-open');
      panel.style.left = '';
      panel.style.top = '';
      panel.style.bottom = '';
      panel.style.width = '';
      panel.style.right = '';
    }

    function closePicker(root) {
      if (!root) return;
      root.classList.remove('open');
      const panel = root._panel;
      if (!panel) return;
      resetPickerPanelStyle(panel);
      if (panel.parentElement !== root) root.appendChild(panel);
    }

    function closeAllPickers(except) {
      document.querySelectorAll('.game-picker.open').forEach(p => {
        if (p !== except) closePicker(p);
      });
      document.querySelectorAll('.time-picker.open').forEach(p => {
        if (p !== except) closeTimePicker(p);
      });
      if (typeof closeCardRowMenu === 'function') closeCardRowMenu();
      if (typeof closeGameRowMenu === 'function') closeGameRowMenu();
    }

    function placePickerPanel(root) {
      const trigger = root.querySelector('.game-picker-trigger');
      const panel = root._panel;
      if (!trigger || !panel) return;
      // 鎸傚埌 body锛歮odal/backdrop-filter 浼氳 fixed 鐩稿閿欒瀹瑰櫒锛屽鑷撮鍒板彸涓嬭
      document.body.appendChild(panel);
      panel.classList.add('is-open');
      const rect = trigger.getBoundingClientRect();
      const width = Math.max(rect.width, 260);
      let left = rect.left;
      let top = rect.bottom + 6;
      panel.style.width = width + 'px';
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
      panel.style.bottom = 'auto';
      panel.style.right = 'auto';
      // 浜屾鏍℃锛氳创杈?/ 鍚戜笂缈?      const pr = panel.getBoundingClientRect();
      const pad = 8;
      if (pr.right > window.innerWidth - pad) {
        left = Math.max(pad, window.innerWidth - pr.width - pad);
        panel.style.left = left + 'px';
      }
      if (pr.bottom > window.innerHeight - pad) {
        const upTop = rect.top - pr.height - 6;
        if (upTop >= pad) {
          panel.style.top = upTop + 'px';
        } else {
          panel.style.top = pad + 'px';
          panel.style.maxHeight = (window.innerHeight - pad * 2) + 'px';
        }
      }
    }

    function renderGamePickerList(root, q) {
      const panel = root._panel || root.querySelector('.game-picker-panel');
      const list = panel && panel.querySelector('.game-picker-list');
      if (!list) return;
      const allowEmpty = root.dataset.allowEmpty === '1';
      const emptyLabel = root.dataset.empty || '鍏ㄩ儴';
      const cur = root.dataset.value || '';
      const qq = (q || '').trim().toLowerCase();
      let rows = pickerItems(root);
      if (qq) rows = rows.filter(it => (it.search || '').toLowerCase().includes(qq));
      let html = '';
      if (allowEmpty) {
        html += `<li data-v="" class="${!cur ? 'active' : ''}"><span class="gp-name">${escapeHtml(emptyLabel)}</span></li>`;
      }
      html += rows.map(it => `
        <li data-v="${escapeHtml(it.id)}" class="${cur === it.id ? 'active' : ''}">
          <span class="gp-name">${escapeHtml(it.name)}</span>
          <span class="gp-id">${escapeHtml(it.sub)}</span>
        </li>`).join('');
      if (!rows.length) html += `<div class="gp-empty">鏃犲尮閰嶉」</div>`;
      list.innerHTML = html;
      list.querySelectorAll('li[data-v]').forEach(li => {
        li.onclick = (e) => {
          e.stopPropagation();
          root.dataset.value = li.getAttribute('data-v') || '';
          refreshGamePickerLabel(root);
          closePicker(root);
          const fn = root.dataset.onchange;
          if (fn && typeof window[fn] === 'function') window[fn]();
        };
      });
    }

    function ensureGamePicker(root) {
      if (!root) return;
      if (root.dataset.ready === '1') {
        refreshGamePickerLabel(root);
        return;
      }
      root.dataset.ready = '1';
      if (!root.dataset.value) root.dataset.value = '';
      const ph = root.dataset.searchPh || '鎼滅储鈥?;
      root.innerHTML = `
        <button type="button" class="game-picker-trigger">
          <span class="gp-label is-placeholder">${escapeHtml(root.dataset.empty || '璇烽€夋嫨')}</span>
          <span class="gp-caret">鈻?/span>
        </button>
        <div class="game-picker-panel">
          <input class="game-picker-search" type="search" placeholder="${escapeHtml(ph)}" autocomplete="off" />
          <ul class="game-picker-list"></ul>
        </div>`;
      const trigger = root.querySelector('.game-picker-trigger');
      const panel = root.querySelector('.game-picker-panel');
      const search = panel.querySelector('.game-picker-search');
      root._panel = panel;

      panel.addEventListener('click', e => e.stopPropagation());
      panel.addEventListener('mousedown', e => e.stopPropagation());

      trigger.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const willOpen = !root.classList.contains('open');
        closeAllPickers(root);
        if (!willOpen) {
          closePicker(root);
          return;
        }
        root.classList.add('open');
        search.value = '';
        renderGamePickerList(root, '');
        placePickerPanel(root);
        setTimeout(() => search.focus(), 0);
      });
      search.addEventListener('input', () => renderGamePickerList(root, search.value));
      search.addEventListener('click', e => e.stopPropagation());
      search.addEventListener('mousedown', e => e.stopPropagation());
      refreshGamePickerLabel(root);
    }

    function fillGameSelects() {
      document.querySelectorAll('.game-picker[data-gp]').forEach(root => {
        ensureGamePicker(root);
        refreshGamePickerLabel(root);
        if (root.classList.contains('open')) renderGamePickerList(root, root._panel?.querySelector('.game-picker-search')?.value || '');
      });

    window.addEventListener('resize', () => closeAllPickers());
    document.addEventListener('scroll', (e) => {
      // 鍒楄〃鍐呴儴婊氬姩涓嶅叧锛涢〉闈㈡粴鍔ㄥ叧鎺夛紝閬垮厤娴眰閿欎綅

    async function loadMenuTemplates() {

    // 鏈嶅姟绔椂闂寸粺涓€瀛?UTC锛汼QLite 缁?isoformat() 杈撳嚭鏃犳椂鍖哄悗缂€鐨勮８涓诧紝
    // 鐩存帴 new Date() 浼氳褰撴垚娴忚鍣ㄦ湰鍦版椂闂?鈫?鏄剧ず/鍥炲～閮藉亸宸?8 灏忔椂銆?    // 瑁镐覆涓€寰嬭ˉ Z 鎸?UTC 瑙ｆ瀽锛屽啀杞祻瑙堝櫒鏈湴鏄剧ず锛?026-09-05锛夈€?    function parseServerTime(v) {
      if (!v) return null;
      let s = String(v).trim();
      if (!s) return null;
      if (!/[zZ]$|[+-]\d{2}:?\d{2}$/.test(s)) s = s.replace(' ', 'T') + 'Z';
      const d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }
    function fmtLocal(v) {
      const d = parseServerTime(v);
      if (!d) return '鈥?;
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    function formatDateTime(v) {
      return fmtLocal(v);
    }

    async function loadTemplatesTable() {
      await loadMenuTemplates();
      tplPage = 1;
      renderTemplatesTable();
    }

    let tplPage = 1; // 妯℃澘鍒楄〃鏈湴鍒嗛〉锛?0/椤碉級

    function renderTemplatesTable() {
      const body = document.getElementById('tpl-body');
      if (!body) return;

      const pages = Math.max(1, Math.ceil(total / pageSize));
      if (tplPage > pages) tplPage = pages;
      const pageRows = list.slice((tplPage - 1) * pageSize, tplPage * pageSize);
      body.innerHTML = pageRows.map(t => `
        <tr>
          <td><code>${escapeHtml(t.id)}</code></td>

          <td>${t.package ? `<code>${escapeHtml(t.package)}</code>` : '<span class="muted">鈥?/span>'}</td>
          <td>${t.feature_count ?? (t.features || []).length}</td>
          <td class="muted">${escapeHtml(formatDateTime(t.created_at))}</td>
          <td class="row-actions">
            <button class="btn sm ghost" onclick='copyTemplateJson(${JSON.stringify(t)})'>澶嶅埗JSON</button>
            <button class="btn sm ghost" onclick='openTemplateModal(${JSON.stringify(t)})'>缂栬緫</button>
            <button class="btn sm ghost" onclick="deleteTemplate('${escapeHtml(t.id)}')">鍒犻櫎</button>
          </td>
        </tr>`).join('') || `<tr><td colspan="6" class="empty">${menuTemplates.length ? '鏃犲尮閰嶆ā鏉? : '鏆傛棤妯℃澘锛屽彲鐐广€屾柊寤烘ā鏉裤€嶆垨銆孞SON 瀵煎叆銆?}</td></tr>`;
      renderPager('tpl-pager', { total, page: tplPage, page_size: pageSize },
        `tplPage=${tplPage - 1};renderTemplatesTable()`,
        `tplPage=${tplPage + 1};renderTemplatesTable()`);
    }

        template_id: t.id || t.template_id,

    function openTemplateJsonModal(preset) {

      openModal(`

        <div class="form-grid">
          <div class="full"><label>JSON</label>
            <textarea id="m-tpl-json" rows="16" style="width:100%;font-family:ui-monospace,monospace;font-size:12px;line-height:1.45;padding:10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);color:inherit"
              spellcheck="false">${escapeHtml(sample)}</textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">鍙栨秷</button>
          <button class="btn" onclick="importTemplatesFromJson()">瀵煎叆</button>
        </div>`);
    }

    function normalizeTemplateJsonItem(raw) {
      if (!raw || typeof raw !== 'object') throw new Error('姣忛」椤讳负 JSON 瀵硅薄');
      const template_id = String(raw.template_id || raw.id || '').trim();
      const name = String(raw.name || '').trim();
      if (!template_id || !name) throw new Error('缂哄皯 template_id / name');
      let features = raw.features;
      if (typeof features === 'string') {
        features = parseFeaturesTextarea(features);
      } else if (!Array.isArray(features) || !features.length) {
        throw new Error(template_id + ': features 椤讳负闈炵┖鏁扮粍');
      } else {
        features = features.map((f, i) => {
          const feat_num = Number(f.feat_num ?? f.num ?? f.id);
          const fname = String(f.name || '').trim();
          if (!Number.isInteger(feat_num) || feat_num < 0 || !fname) {
            throw new Error(template_id + `: features[${i}] 闇€瑕?feat_num + name`);
          }
          return { feat_num, name: fname };
        });
      }
      return {
        template_id,
        name,
        package: (raw.package && String(raw.package).trim()) || null,
        source: (raw.source && String(raw.source).trim()) || null,
        features
      };
    }

    async function importTemplatesFromJson() {
      try {
        const rawText = document.getElementById('m-tpl-json').value.trim();
        if (!rawText) { toast('璇风矘璐?JSON'); return; }
        let parsed = JSON.parse(rawText);
        if (!Array.isArray(parsed)) parsed = [parsed];
        if (!parsed.length) { toast('JSON 涓虹┖'); return; }
        let created = 0, updated = 0, linkedGames = 0;
        for (const item of parsed) {
          const body = normalizeTemplateJsonItem(item);
          const exists = menuTemplates.some(t => t.id === body.template_id);
          if (exists) {
            await api('/v1/admin/menu-templates/' + encodeURIComponent(body.template_id), {
              method: 'PATCH',
              body: JSON.stringify({
                name: body.name,
                package: body.package,
                source: body.source,
                features: body.features
              })
            });
            updated++;
          } else {
            const r = await api('/v1/admin/menu-templates', {
              method: 'POST',
              body: JSON.stringify(body)
            });
            created++;
            if (r.data?.linkage?.game_created || r.data?.linkage?.game_bound) linkedGames++;
          }
        }
        closeModal();
        toast(`瀵煎叆瀹屾垚锛氭柊寤?${created}锛屾洿鏂?${updated}` + (linkedGames ? `锛岃仈鍔ㄦ父鎴?${linkedGames}` : ''));
        await loadTemplatesTable();
        if (linkedGames) await loadGamesCatalog();
      } catch (e) {
        toast(e.message || String(e));
      }
    }

    function featuresToTextarea(features) {
      return (features || []).map(f => `${f.feat_num}|${f.name}`).join('\n');
    }

    function parseFeaturesTextarea(text) {
      const lines = (text || '').split('\n').map(s => s.trim()).filter(Boolean);
      const features = [];
      for (const line of lines) {
        const m = line.match(/^(\d+)\s*[|锛?]\s*(.+)$/);
        if (!m) throw new Error('鍔熻兘琛屾牸寮忓簲涓猴細缂栧彿|鍚嶇О锛屼緥濡?1|鏃犳晫');
        features.push({ feat_num: parseInt(m[1], 10), name: m[2].trim() });
      }
      if (!features.length) throw new Error('鑷冲皯濉啓 1 涓姛鑳?);
      return features;
    }

    function openTemplateModal(tpl) {
      const isEdit = !!(tpl && tpl.id);
      openModal(`
        <h3>${isEdit ? '缂栬緫鑿滃崟妯℃澘' : '鏂板缓鑿滃崟妯℃澘'}</h3>
        <p class="sub">鍔熻兘鍒楄〃鏍煎紡锛氭瘡琛?<code>缂栧彿|鍚嶇О</code>锛屼笌瀹㈡埛绔?feat_num 瀵归綈銆備繚瀛樺悗绔嬪埢鐢熸晥锛屾棤闇€閲嶅惎銆?/p>
        <div class="form-grid">
          <div class="full"><label>妯℃澘 id</label>
            <input id="m-tpl-id" value="${escapeHtml(tpl?.id || '')}" ${isEdit ? 'disabled' : ''}
              placeholder="濡?blzz锛屽缓璁笌 game_id 鍚屽悕" /></div>
          <div class="full"><label>鍚嶇О</label>
            <input id="m-tpl-name" value="${escapeHtml(tpl?.name || '')}" placeholder="濡?鍫″瀿涔嬫垬" /></div>
          <div class="full"><label>鍖呭悕锛堝彲閫夛級</label>
            <input id="m-tpl-pkg" value="${escapeHtml(tpl?.package || '')}" placeholder="com.xxx.yyy" /></div>
          <div class="full"><label>澶囨敞/鏉ユ簮锛堝彲閫夛級</label>
            <input id="m-tpl-src" value="${escapeHtml(tpl?.source || '')}" placeholder="Games/XxxMod.h" /></div>
          <div class="full"><label>鍔熻兘鍒楄〃</label>
            <textarea id="m-tpl-feats" rows="8" style="width:100%;font-family:ui-monospace,monospace;font-size:13px;line-height:1.5;padding:10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);color:inherit"
              placeholder="1|鏃犳晫&#10;2|鍗佸€嶆敾鍑?>${escapeHtml(featuresToTextarea(tpl?.features))}</textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">鍙栨秷</button>
          <button class="btn" onclick="saveTemplate(${isEdit ? `'${escapeHtml(tpl.id)}'` : 'null'})">淇濆瓨</button>
        </div>`);
    }

    async function saveTemplate(editId) {
      try {
        const template_id = (editId || document.getElementById('m-tpl-id').value).trim();
        const name = document.getElementById('m-tpl-name').value.trim();
        const packageName = document.getElementById('m-tpl-pkg').value.trim() || null;
        const source = document.getElementById('m-tpl-src').value.trim() || null;
        const features = parseFeaturesTextarea(document.getElementById('m-tpl-feats').value);
        if (!template_id || !name) { toast('璇峰～鍐欐ā鏉?id 涓庡悕绉?); return; }
        if (editId) {
          await api('/v1/admin/menu-templates/' + encodeURIComponent(editId), {
            method: 'PATCH',
            body: JSON.stringify({ name, package: packageName, source, features })
          });
          toast('妯℃澘宸叉洿鏂?);
        } else {
          const r = await api('/v1/admin/menu-templates', {
            method: 'POST',
            body: JSON.stringify({ template_id, name, package: packageName, source, features })
          });
          toast(r.message || '妯℃澘宸插垱寤?);
          if (r.data?.linkage?.game_created) await loadGamesCatalog();
        }
        closeModal();
        await loadTemplatesTable();
      } catch (e) { toast(e.message); }
    }

    async function deleteTemplate(id) {
      if (!confirm('鍒犻櫎妯℃澘銆? + id + '銆嶏紵\n鑻ユ湁娓告垙缁戝畾锛岃鍏堣В缁戞垨纭寮哄埗鍒犻櫎銆?)) return;
      try {
        await api('/v1/admin/menu-templates/' + encodeURIComponent(id), { method: 'DELETE' });
        toast('宸插垹闄?);
        await loadTemplatesTable();
      } catch (e) {
        if (String(e.message || '').includes('浠嶆湁')) {
          if (confirm(e.message + '\n\n鏄惁寮哄埗鍒犻櫎骞舵竻绌鸿繖浜涙父鎴忕殑妯℃澘缁戝畾锛?)) {
            try {
              await api('/v1/admin/menu-templates/' + encodeURIComponent(id) + '?force=true', { method: 'DELETE' });
              toast('宸插己鍒跺垹闄?);
              await loadTemplatesTable();
            } catch (e2) { toast(e2.message); }
          }
        } else toast(e.message);
      }
    }

    function templateOptionsHtml(selected) {
      let html = '<option value="">涓嶇粦瀹氾紙绋嶅悗鎵嬪姩鍚屾锛?/option>';
      menuTemplates.forEach(t => {
        html += `<option value="${escapeHtml(t.id)}" ${selected === t.id ? 'selected' : ''}>${escapeHtml(t.name)}锛?{escapeHtml(t.id)} 路 ${t.feature_count} 椤癸級</option>`;
      });
      return html;
    }

    function previewTemplateFeatures(templateId) {
      const box = document.getElementById('m-g-preview');
      if (!box) return;
      const t = menuTemplates.find(x => x.id === templateId);
      if (!t) { box.innerHTML = '<span class="muted">涓嶇粦瀹氭ā鏉垮垯涓嶄細鑷姩鍐欏叆鍔熻兘</span>'; return; }
      box.innerHTML = `<div class="muted" style="margin-bottom:6px">灏嗚嚜鍔ㄥ啓鍏ワ細</div>` +
        t.features.map(f => `<code>#${f.feat_num}</code> ${escapeHtml(f.name)}`).join('<br/>');
    }

    function showApp() {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');
      const uname = localStorage.getItem('sg_admin_user') || 'admin';
      document.getElementById('who').textContent = uname;
      const av = document.getElementById('who-avatar');
      if (av) av.textContent = (uname[0] || 'A').toUpperCase();
      const savedUser = localStorage.getItem('sg_admin_user_saved');
      if (savedUser) document.getElementById('login-user').value = savedUser;
      initStaticTimePickers();
      refreshAll(true).then(() => switchPage('dashboard'));
    }

    /** 椤甸潰闈欐€佸尯鍩熺殑鏃堕棿閫夋嫨鍣ㄦ寕杞斤紙寮圭獥鍐呯殑鐢?openModal 鈫?initTimePickers 璐熻矗锛?*/
    function initStaticTimePickers() {
      const slots = [
        ['au-from-slot', 'au-from', {}],
        ['au-to-slot', 'au-to', {}],
      ];
      let added = false;
      for (const [slotId, id, opts] of slots) {
        const slot = document.getElementById(slotId);
        if (slot && !slot.firstChild) {
          slot.innerHTML = timePickerMarkup(id, opts);
          added = true;
        }
      }
      if (added) initTimePickers();
    }

    async function doLogin() {
      try {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value;
        const data = await api('/v1/admin/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        token = data.data.token;
        localStorage.setItem('sg_admin_token', token);
        localStorage.setItem('sg_admin_user', data.data.username);
        localStorage.setItem('sg_admin_user_saved', data.data.username);
        document.getElementById('login-pass').value = '';
        toast('鐧诲綍鎴愬姛');
        showApp();
      } catch (e) { toast(e.message); }
    }

    /** 閫€鍑虹櫥褰曪細鍏堜簩娆＄‘璁わ紝纭鍚庣敱 doLogout 鐪熸鎵ц */
    function logout() {
      openModal(`
        <h3>閫€鍑虹櫥褰?/h3>
        <p class="muted">纭畾瑕侀€€鍑哄綋鍓嶈处鍙峰悧锛?/p>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">鍙栨秷</button>
          <button class="btn danger" onclick="doLogout()">閫€鍑?/button>
        </div>`);
    }

    function doLogout() {
      token = '';
      localStorage.removeItem('sg_admin_token');
      location.reload();
    }

    /** 宸︿笅瑙掕处鍙峰崱鐗囦笅鎷夎彍鍗?*/
    function toggleAccountMenu(e) {
      e.stopPropagation();
      const card = document.getElementById('account-card');
      const open = card.classList.toggle('open');
      card.querySelector('.account-main').setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    document.addEventListener('click', function (e) {
      const card = document.getElementById('account-card');
      if (card && card.classList.contains('open') && !card.contains(e.target)) {
        card.classList.remove('open');
        card.querySelector('.account-main').setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      const card = document.getElementById('account-card');
      if (card && card.classList.contains('open')) {
        card.classList.remove('open');
        card.querySelector('.account-main').setAttribute('aria-expanded', 'false');
      }
    });
    /* boot */
    const savedUser = localStorage.getItem('sg_admin_user_saved');
    if (savedUser) document.getElementById('login-user').value = savedUser;
    if (token) showApp();
  </script>
</body>
</html>
