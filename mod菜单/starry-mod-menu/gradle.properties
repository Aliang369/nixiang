# Gradle properties
org.gradle.jvmargs=-Xmx2048m --enable-native-access=ALL-UNNAMED
android.useAndroidX=true

# 本项目需要 JDK 17（Gradle 8.13 / AGP 8.6 与 JDK 25 不兼容）
# 注意：这里不要写死机器路径 —— 由 JAVA_HOME 决定（出包脚本会
# export JAVA_HOME="$(/usr/libexec/java_home -v 17)"；Windows 侧用 JDK 17 的 JAVA_HOME）。
# 确实需要指定时用命令行覆盖：./gradlew assembleRelease -Dorg.gradle.java.home=/path/to/jdk-17

# 本仓库路径含中文（mod菜单）→ AGP 的 ASCII 路径检查必然报错，按报错原文关闭该检查（Windows 侧出包必需）
android.overridePathCheck=true
