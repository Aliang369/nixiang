# DSHK cloud config
#
# ===========================================================================
#  ALL FEATURES MUST STAY OFF IN THIS FILE.
#
#  The provider (inside the APK) fetches this file and pushes the values
#  STRAIGHT to native, before the panel exists and regardless of the card key.
#  If damage=99999 / on=1 is written here, every installation gets 99999
#  immediately and the card key protects nothing.
#
#  With everything off:
#     no card key   -> the game stays vanilla
#     card key ok   -> the cloud panel pushes the real values on demand
#
#  Changing this file needs no APK reinstall; just restart the game.
# ===========================================================================

damage=1
on=0
hplock=0
adskip=0
pick=0
speedon=0
speedlv=5
